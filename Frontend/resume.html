<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Resume Builder | CareerAI</title><link rel="stylesheet" href="style.css"><script src="api.js" defer></script></head>
<body><header class="navbar"><a href="dashboard.html" class="logo">Career<span>AI.</span></a><nav class="nav-links"><a href="dashboard.html">Dashboard</a><a href="applications.html">Applications</a></nav><button class="button button-small" id="logoutButton">Logout</button></header>
<main class="section"><div class="section-heading"><h1>AI Resume Builder</h1><p>Choose a saved application and generate a tailored resume.</p></div>
<section class="auth-card wide-card"><div class="form-group"><label for="applicationSelect">Saved application</label><select id="applicationSelect"><option value="">Loading applications...</option></select></div><div class="form-group"><label for="jobDescription">Job Description</label><textarea id="jobDescription" rows="8"></textarea></div><button class="button" id="generateButton">Generate Resume</button><p id="message" class="form-message"></p><pre id="result"></pre></section></main>
<script>
requireLogin();
(async()=>{try{const apps=await apiRequest("/applications");const sel=document.getElementById("applicationSelect");sel.innerHTML='<option value="">Select an application</option>'+apps.map(a=>`<option value="${a.id}" data-description="${escapeHTML(a.job_description||"")}">${escapeHTML(a.job_title)} — ${escapeHTML(a.company_name)}</option>`).join("");sel.onchange=()=>{const o=sel.selectedOptions[0];document.getElementById("jobDescription").value=o?.dataset.description||"";};}catch(e){document.getElementById("message").textContent=e.message;}})();
document.getElementById("generateButton").onclick=async()=>{const id=Number(document.getElementById("applicationSelect").value),desc=document.getElementById("jobDescription").value.trim();const out=document.getElementById("result"),msg=document.getElementById("message");if(!id||!desc){msg.textContent="Select an application and provide its job description.";return;}out.textContent="Generating...";try{const d=await apiRequest("/ai/generate-resume",{method:"POST",body:jsonBody({application_id:id,job_description:desc})});out.textContent=d.tailored_resume;msg.textContent="Resume generated and saved to this application's artifacts.";}catch(e){out.textContent=e.message;}};
</script></body></html>
