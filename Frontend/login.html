<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | CareerAI</title>
<link rel="stylesheet" href="style.css">
<script src="api.js" defer></script>
</head>
<body>
<header class="navbar">
    <a href="index.html" class="logo">Career<span>AI.</span></a>
    <a href="index.html" class="login-link">← Back to Home</a>
</header>
<main class="auth-page">
<section class="auth-card">
    <div class="auth-heading">
        <span class="eyebrow">WELCOME BACK</span>
        <h1>Login to CareerAI</h1>
        <p>Continue managing your career journey.</p>
    </div>
    <form id="loginForm">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="button auth-submit">Login</button>
        <p id="loginMessage" class="form-message"></p>
    </form>
    <p class="auth-switch">Don't have an account? <a href="register.html">Create an account</a></p>
</section>
</main>
<script>
document.getElementById("loginForm").addEventListener("submit", async event => {
    event.preventDefault();
    const message = document.getElementById("loginMessage");
    message.textContent = "Checking credentials...";
    try {
        const data = await apiRequest("/login", {
            method: "POST",
            body: jsonBody({
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
            })
        });
        localStorage.setItem("access_token", data.access_token);
        message.textContent = "Login successful. Opening dashboard...";
        window.location.href = "dashboard.html";
    } catch (error) {
        message.textContent = error.message;
    }
});
</script>
</body>
</html>
