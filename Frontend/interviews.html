<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Interview Preparation | CareerAI</title><link rel="stylesheet" href="style.css"><script src="api.js" defer></script></head>
<body><header class="navbar"><a href="dashboard.html" class="logo">Career<span>AI.</span></a><nav class="nav-links"><a href="dashboard.html">Dashboard</a><a href="applications.html">Applications</a></nav><button class="button button-small" id="logoutButton">Logout</button></header>
<main class="section"><div class="section-heading"><h1>Interview Preparation</h1><p>Record interview rounds, questions, responses and feedback against an application.</p></div>
<section class="auth-card wide-card"><div class="form-group"><label for="appSelect">Application</label><select id="appSelect"></select></div>
<form id="interviewForm"><div class="form-group"><label for="round">Interview Round</label><input id="round" placeholder="Technical round, HR round..."></div><div class="form-group"><label for="date">Interview Date</label><input id="date" type="datetime-local"></div><div class="form-group"><label for="type">Interview Type</label><input id="type" placeholder="Online / In-person"></div><div class="form-group"><label for="interviewer">Interviewer Name</label><input id="interviewer"></div><div class="form-group"><label for="questions">Questions Asked</label><textarea id="questions"></textarea></div><div class="form-group"><label for="responses">Your Responses</label><textarea id="responses"></textarea></div><div class="form-group"><label for="feedback">Feedback</label><textarea id="feedback"></textarea></div><div class="form-group"><label for="result">Result</label><input id="result"></div><button class="button">Save Interview</button></form><p id="interviewMessage" class="form-message"></p></section>
<section class="auth-card wide-card"><h2>Application Questions & Answers</h2><form id="qaForm"><div class="form-group"><label for="qaQuestion">Question</label><textarea id="qaQuestion" required></textarea></div><div class="form-group"><label for="qaAnswer">Answer</label><textarea id="qaAnswer"></textarea></div><label><input type="checkbox" id="answerVerified"> Answer verified</label><button class="button">Save Q&A</button></form><p id="qaMessage" class="form-message"></p></section>
<section class="feature-card"><h2>Saved Interview Records</h2><button class="button button-small" id="loadRecords">Load Records</button><div id="records"></div></section>
</main>
<script>
requireLogin();
async function loadApps(){const apps=await apiRequest("/applications");const s=document.getElementById("appSelect");s.innerHTML=apps.map(a=>`<option value="${a.id}">${escapeHTML(a.job_title)} — ${escapeHTML(a.company_name)}</option>`).join("");}
document.getElementById("interviewForm").onsubmit=async e=>{e.preventDefault();const id=document.getElementById("appSelect").value;if(!id)return;const date=document.getElementById("date").value;try{await apiRequest(`/applications/${id}/interviews`,{method:"POST",body:jsonBody({interview_round:document.getElementById("round").value||null,interview_date:date?new Date(date).toISOString():null,interview_type:document.getElementById("type").value||null,interviewer_name:document.getElementById("interviewer").value||null,questions_asked:document.getElementById("questions").value||null,candidate_responses:document.getElementById("responses").value||null,feedback:document.getElementById("feedback").value||null,result:document.getElementById("result").value||null})});document.getElementById("interviewMessage").textContent="Interview saved.";e.target.reset();}catch(err){document.getElementById("interviewMessage").textContent=err.message;}};
document.getElementById("qaForm").onsubmit=async e=>{e.preventDefault();const id=document.getElementById("appSelect").value;if(!id)return;try{await apiRequest(`/applications/${id}/questions`,{method:"POST",body:jsonBody({question:document.getElementById("qaQuestion").value,answer:document.getElementById("qaAnswer").value||null,answer_verified:document.getElementById("answerVerified").checked})});document.getElementById("qaMessage").textContent="Question and answer saved.";e.target.reset();}catch(err){document.getElementById("qaMessage").textContent=err.message;}};
document.getElementById("loadRecords").onclick=async()=>{const id=document.getElementById("appSelect").value;const out=document.getElementById("records");if(!id){out.textContent="No application selected.";return;}try{const [interviews,questions]=await Promise.all([apiRequest(`/applications/${id}/interviews`),apiRequest(`/applications/${id}/questions`)]);out.innerHTML="<h3>Interviews</h3>"+(interviews.map(i=>`<article class="feature-card"><strong>${escapeHTML(i.interview_round||"Interview")}</strong><p>${escapeHTML(i.interview_date||"Date not set")}</p><p>${escapeHTML(i.feedback||"No feedback recorded")}</p><p>Result: ${escapeHTML(i.result||"Not recorded")}</p></article>`).join("")||"<p>No interviews recorded.</p>")+"<h3>Questions</h3>"+(questions.map(q=>`<p><strong>${escapeHTML(q.question)}</strong><br>${escapeHTML(q.answer||"No answer")} (${q.answer_verified?"verified":"unverified"})</p>`).join("")||"<p>No questions saved.</p>");}catch(e){out.textContent=e.message;}};
loadApps().catch(e=>document.getElementById("interviewMessage").textContent=e.message);
</script></body></html>
